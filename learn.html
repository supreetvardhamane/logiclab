<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LogicLab Article Reader — Read C++ articles with inline Quick Check MCQs.">
  <title>LogicLab — Learn</title>

  <link rel="stylesheet" href="css/main.css">

  <!-- Prism.js — used by render.js for all <code> blocks in articles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js" defer></script>
  <!-- NOTE: CodeMirror is NOT loaded here. Lazy loaded only in challenge.html -->
</head>
<body>
  <div class="page-shell">
    <header id="navbar-slot"></header>

    <!-- Reading progress bar (fixed below navbar) -->
    <div id="reading-progress" class="reading-progress" style="transform:scaleX(0)" aria-hidden="true"></div>

    <main id="app" role="main" aria-live="polite">
      <!-- Router injects module overview or article reader here -->
    </main>

    <footer style="padding:var(--sp-6) var(--sp-12);border-top:1px solid var(--border);
                   text-align:center;color:var(--text-muted);font-size:var(--text-xs)">
      LogicLab · Learn C++ the Scientific Way
    </footer>
  </div>

  <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <script type="module">
    import { createRouter } from './js/router.js';
    import { renderNavbar  } from './js/components/navbar.js';

    document.getElementById('navbar-slot').appendChild(renderNavbar(''));

    createRouter({
      '/module/:id':              () => import('./js/pages/module.js'),
      '/module/:id/article/:n':   () => import('./js/pages/article.js'),
    });
  </script>
</body>
</html>
