<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LogicLab Quiz — End-of-module multiple choice questions with spaced repetition integration.">
  <title>LogicLab — Quiz</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/quiz.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header id="navbar-slot"></header>

    <!-- Quiz progress bar (fixed below navbar) -->
    <div id="quiz-progress-bar" class="progress-bar"
         style="position:fixed;top:var(--navbar-h);left:0;right:0;border-radius:0;z-index:98;"
         role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar__fill" id="quiz-progress-fill"
           style="background:var(--brand-purple);width:0%;transition:width .3s ease"></div>
    </div>

    <main id="app" role="main" aria-live="polite">
      <!-- Quiz engine renders here: one question per full view -->
    </main>
  </div>

  <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <script type="module">
    import { createRouter } from './js/router.js';
    import { renderNavbar  } from './js/components/navbar.js';

    document.getElementById('navbar-slot').appendChild(renderNavbar(''));

    createRouter({
      '/quiz/:id':        () => import('./js/pages/quiz.js'),
      '/quiz/:id/result': () => import('./js/pages/quiz.js'),
    });
  </script>
</body>
</html>
